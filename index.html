<div id="auth-overlay" style="position:fixed;inset:0;background:#0a0a0a;display:flex;align-items:center;justify-content:center;z-index:99999;">

    <p style="font-size:12px;color:#6b7280;margin-bottom:28px;">チーム分けツール</p>
    <p id="auth-error" style="color:#f87171;font-size:13px;margin-bottom:12px;display:none;">パスワードが違います</p>
    <input type="password" id="auth-pw" placeholder="パスワードを入力" style="width:100%;padding:12px;font-size:15px;text-align:center;background:#1a1a1a;border:1px solid #333;border-radius:8px;color:#e0e0e0;margin-bottom:14px;letter-spacing:4px;box-sizing:border-box;" autofocus>
    <button onclick="checkAuth()" style="width:100%;padding:12px;font-size:14px;font-weight:700;background:#2563eb;color:#fff;border:none;border-radius:8px;cursor:pointer;">入る</button>
  </div>
</div>
<script>
(function(){
  var PW='bskobe2026';
  if(sessionStorage.getItem('auth')==='ok'){document.getElementById('auth-overlay').style.display='none';}
  window.checkAuth=function(){
    var input=document.getElementById('auth-pw').value;
    if(input===PW){sessionStorage.setItem('auth','ok');document.getElementById('auth-overlay').style.display='none';}
    else{document.getElementById('auth-error').style.display='block';document.getElementById('auth-pw').value='';document.getElementById('auth-pw').focus();}
  };
  document.getElementById('auth-pw').addEventListener('keydown',function(e){if(e.key==='Enter')window.checkAuth();});
})();
</script>

if (!myUserId) {

}

function initFirebase() {
db.ref(PATH_LIVE).on('value', snapshot => {
const data = snapshot.val();
if (!data) {
setSyncDot('online');
setStatus('接続中 — 誰もまだ操作していません');
return;
}
if (data.updatedBy === myUserId) {
setSyncDot('online');
return;
}
isRemote = true;
teams = data.teams.map(t => ({ id:t.id, name:t.name, members:[...t.members] }));
unassigned = [...(data.unassigned || [])];
teamCounter = data.teamCounter || teams.reduce((m,t) => Math.max(m,t.id), 0);
renderAll();
isRemote = false;
setSyncDot('online');
setStatus('接続中');
showToast('🔄 ' + (data.updatedByName || '誰か') + ' が変更しました');
}, err => {
setSyncDot('error');
setStatus('接続エラー: ' + (err.code || err.message));
console.error('Firebase error:', err);
});
db.ref(PATH_PRESENCE + '/' + myUserId).set({ lastSeen: firebase.database.ServerValue.TIMESTAMP });
db.ref(PATH_PRESENCE + '/' + myUserId).onDisconnect().remove();
db.ref(PATH_PRESENCE).on('value', snap => {
const p = snap.val() || {};
const count = Object.keys(p).length;
document.getElementById('sync-users').textContent =
count > 1 ? '👥 ' + count + '人が接続中' : '';
});
setSyncDot('online');
setStatus('接続中');
}
function pushState() {
if (isRemote) return;
setSyncDot('syncing');
db.ref(PATH_LIVE).set({
teams: teams.map(t => ({ id:t.id, name:t.name, members:[...t.members] })),
unassigned: [...unassigned],
teamCounter,
updatedBy: myUserId,
updatedByName: 'スタッフ_' + myUserId.slice(-4),
updatedAt: firebase.database.ServerValue.TIMESTAMP,
})
.then(() => setSyncDot('online'))
.catch(e => {
setSyncDot('error');
setStatus('書き込みエラー: ' + (e.code || e.message));
console.error('pushState error:', e);
});
}
function setSyncDot(state) {
document.getElementById('sync-dot').className = state;
}
function setStatus(msg) {
document.getElementById('sync-status').textContent = 'リアルタイム同期：' + msg;
}
function setupFilters() {
['filter-gender','filter-grade','filter-pos','filter-english'].forEach(id => {
document.getElementById(id).addEventListener('change', () => {
filterState.gender = document.getElementById('filter-gender').value;
filterState.grade = document.getElementById('filter-grade').value;
filterState.pos = document.getElementById('filter-pos').value;
filterState.english = document.getElementById('filter-english').value;
renderUnassigned();
});
});
}
function matchesFilter(p) {
if (filterState.gender && p.gender !== filterState.gender) return false;
if (filterState.grade && p.grade !== filterState.grade) return false;
if (filterState.pos && p.pos !== filterState.pos) return false;
if (filterState.english && p.english !== filterState.english) return false;
return true;
}
function isAnyFilterActive() {
return filterState.gender||filterState.grade||filterState.pos||filterState.english;
}
function renderAll() { renderUnassigned(); renderTeams(); }
function renderUnassigned() {
const list = document.getElementById('unassigned-list');
list.innerHTML = '';
const sorted = [...unassigned];
if (isAnyFilterActive()) {
sorted.sort((a,b) => (matchesFilter(PLAYERS[a])?0:1) - (matchesFilter(PLAYERS[b])?0:1));
}
sorted.forEach(idx => {
list.appendChild(makeCard(idx, isAnyFilterActive() && !matchesFilter(PLAYERS[idx])));
});
document.getElementById('unassigned-count').textContent = unassigned.length;
setupDropZone(list, 'unassigned', null);
}

const p = PLAYERS[idx];
const gc = p.gender==='男' ? 'male' : 'female';
const gl = p.gender==='男' ? '男性' : '女性';

card.className = 'player-card ' + gc + (faded ? ' filtered-out' : '');

card.draggable = true;
let av;
if (p.photo) {
av = document.createElement('img');
av.className='card-photo'; av.src=p.photo; av.alt=p.name;
av.onerror = () => av.replaceWith(makeInitial(p.name[0], gc));
} else {

card.appendChild(av);
const info = document.createElement('div');
info.className = 'card-info';

'<div class="card-name">' + p.name + '</div>' +
'<div class="card-sub">' + p.grade + '｜' + p.height + 'cm</div>' +
'<div class="card-badges">' +

card.addEventListener('dragend', onDragEnd);

}

const chips = ['PG','SG','SF','PF','C','未定'].filter(p=>pc[p])
.map(p=>'<span class="pos-chip pos-'+p+'">'+p+':'+pc[p]+'</span>').join('');
stats.innerHTML = 'avg '+avgH+'cm ｜ 男性'+m+' 女性'+f+'<br><div class="pos-row">'+chips+'</div>';
} else { stats.textContent = '空'; }
board.appendChild(stats);
const dz = document.createElement('div');
dz.className = 'team-drop-zone'+(team.members.length===0?' empty':'');
dz.dataset.teamId = team.id;
team.members.forEach((idx,pos) => {
dz.appendChild(makeDropIndicator(team.id, pos));
dz.appendChild(makeCard(idx));
});
dz.appendChild(makeDropIndicator(team.id, team.members.length));
setupDropZone(dz, 'team', team.id);
board.appendChild(dz);
return board;
}
function makeDropIndicator(teamId, pos) {
const d = document.createElement('div');
d.className='drop-indicator'; d.dataset.teamId=teamId; d.dataset.pos=pos; return d;
}
function setupDropZone(el, type, teamId) {
el.addEventListener('dragover', e => {
e.preventDefault(); el.classList.add('drag-over');
if (type==='team') highlightInd(e, el);
});
el.addEventListener('dragleave', e => {
if (!el.contains(e.relatedTarget)) { el.classList.remove('drag-over'); clearInds(el); }
});
el.addEventListener('drop', e => {
e.preventDefault(); el.classList.remove('drag-over');
if (!dragInfo) return;
if (type==='unassigned') moveToUnassigned(dragInfo.playerIdx, dragInfo.fromType, dragInfo.fromTeamId);
else moveToTeam(dragInfo.playerIdx, dragInfo.fromType, dragInfo.fromTeamId, teamId, getDropPos(e,el));
clearInds(el); dragInfo=null;
});
}
function highlightInd(e, dz) {
const inds=dz.querySelectorAll('.drop-indicator'), cards=dz.querySelectorAll('.player-card');
clearInds(dz);
let best=inds[inds.length-1];
for (let i=0;i<cards.length;i++) {
const r=cards[i].getBoundingClientRect();
if (e.clientY<r.top+r.height/2){best=inds[i];break;}
}
if (best) best.classList.add('active');
}
function clearInds(el) { el.querySelectorAll('.drop-indicator.active').forEach(i=>i.classList.remove('active')); }
function getDropPos(e,dz) {
const cards=dz.querySelectorAll('.player-card');
for (let i=0;i<cards.length;i++){const r=cards[i].getBoundingClientRect();if(e.clientY<r.top+r.height/2)return i;}
return cards.length;
}
function onDragStart(e,idx) {
dragInfo={
playerIdx:idx,
fromType: e.currentTarget.closest('#unassigned-list')?'unassigned':'team',
fromTeamId: e.currentTarget.closest('[data-team-id]')?.dataset.teamId||null,
};
setTimeout(()=>e.currentTarget.classList.add('dragging'),0);
}
function onDragEnd(e) {
e.currentTarget.classList.remove('dragging'); dragInfo=null;
document.querySelectorAll('.drop-indicator.active').forEach(i=>i.classList.remove('active'));
document.querySelectorAll('.drag-over').forEach(el=>el.classList.remove('drag-over'));
}
function moveToTeam(playerIdx, fromType, fromTeamId, toTeamId, pos) {
if (fromType==='unassigned') unassigned=unassigned.filter(i=>i!==playerIdx);
else { const ft=teams.find(t=>t.id==fromTeamId); if(ft) ft.members=ft.members.filter(i=>i!==playerIdx); }
const tt=teams.find(t=>t.id==toTeamId);
if (tt) tt.members.splice(pos,0,playerIdx);
renderAll(); pushState();
}
function moveToUnassigned(playerIdx, fromType, fromTeamId) {
if (fromType==='team') {
const ft=teams.find(t=>t.id==fromTeamId);
if (ft) ft.members=ft.members.filter(i=>i!==playerIdx);
if (!unassigned.includes(playerIdx)) unassigned.push(playerIdx);
renderAll(); pushState();
}
}
function openTeamModal() { document.getElementById('team-modal').classList.add('open'); }
function closeTeamModal() { document.getElementById('team-modal').classList.remove('open'); }
function createTeams() {
const n=parseInt(document.getElementById('team-count-input').value)||1;
for (let i=0;i<n;i++){teamCounter++;teams.push({id:teamCounter,name:'チーム '+teamCounter,members:[]});}
closeTeamModal(); renderTeams(); pushState();
}
function chkTeams(){if(teams.length===0){alert('先にチームを作成してください');return false;}return true;}
function autoAssignBalance() {
if(!chkTeams())return;
snakeAssign([...unassigned].sort((a,b)=>PLAYERS[b].height-PLAYERS[a].height));
unassigned=[]; renderAll(); pushState();
}
function autoAssignMix() {
if(!chkTeams())return;
snakeAssign(unassigned.filter(i=>PLAYERS[i].gender==='男').sort((a,b)=>PLAYERS[b].height-PLAYERS[a].height));
snakeAssign(unassigned.filter(i=>PLAYERS[i].gender==='女').sort((a,b)=>PLAYERS[b].height-PLAYERS[a].height));
unassigned=[]; renderAll(); pushState();
}
function autoAssignPos() {
if(!chkTeams())return;
['PG','SG','SF','PF','C','未定'].forEach(pos=>{
snakeAssign(unassigned.filter(i=>(PLAYERS[i].pos||'未定')===pos).sort((a,b)=>PLAYERS[b].height-PLAYERS[a].height));
});
unassigned=[]; renderAll(); pushState();
}
function autoAssignAll() {
if(!chkTeams())return;
const posOrder=['PG','SG','SF','PF','C','未定'];
const groups=[];
posOrder.forEach(pos=>{
['男','女'].forEach(gender=>{
const g=unassigned.filter(i=>(PLAYERS[i].pos||'未定')===pos&&PLAYERS[i].gender===gender)
.sort((a,b)=>PLAYERS[b].height-PLAYERS[a].height);
if(g.length>0) groups.push(g);
});
});
groups.forEach(group=>{
group.forEach(idx=>{
const minC=Math.min(...teams.map(t=>t.members.length));
const cands=teams.filter(t=>t.members.length===minC);
const best=cands.reduce((a,b)=>avgH(a)<=avgH(b)?a:b);
best.members.push(idx);
});
});
const pr={PG:0,SG:1,SF:2,PF:3,C:4,'未定':5};
teams.forEach(t=>t.members.sort((a,b)=>{
const d=(pr[PLAYERS[a].pos||'未定']??5)-(pr[PLAYERS[b].pos||'未定']??5);
return d!==0?d:PLAYERS[b].height-PLAYERS[a].height;
}));
unassigned=[]; renderAll(); pushState();
}
function avgH(t){
if(!t.members.length)return 0;
return t.members.reduce((s,i)=>s+(PLAYERS[i].height||160),0)/t.members.length;
}
function snakeAssign(arr){
let dir=1,ti=0;
arr.forEach(idx=>{
teams[ti].members.push(idx); ti+=dir;
if(ti>=teams.length){ti=teams.length-1;dir=-1;}
if(ti<0){ti=0;dir=1;}
});
}
function resetAll(){
if(!confirm('全員を未配置に戻しますか？'))return;
unassigned=PLAYERS.map((_,i)=>i);
teams.forEach(t=>t.members=[]);
renderAll(); pushState();
}
function openSaveModal(){
renderSavePreview();
document.getElementById('save-name-input').value='';
document.getElementById('save-modal').classList.add('open');
setTimeout(()=>document.getElementById('save-name-input').focus(),100);
}
function closeSaveModal(){ document.getElementById('save-modal').classList.remove('open'); }
function openLoadModal() { renderLoadList(); document.getElementById('load-modal').classList.add('open'); }
function closeLoadModal(){ document.getElementById('load-modal').classList.remove('open'); }
function executeSave(){
const name=document.getElementById('save-name-input').value.trim();
if(!name){alert('保存名を入力してください');return;}
setSyncDot('syncing');
db.ref(PATH_SAVES).once('value').then(snap=>{
const saves=snap.val()||{};
const existKey=Object.keys(saves).find(k=>saves[k].name===name);
if(existKey&&!confirm('"'+name+'" は既に存在します。上書きしますか？')){setSyncDot('online');return;}
if(existKey) delete saves[existKey];
const key='s'+Date.now();
saves[key]={
name,
savedAt: new Date().toLocaleString('ja-JP'),
savedBy: 'スタッフ_'+myUserId.slice(-4),
teams: teams.map(t=>({id:t.id,name:t.name,members:[...t.members]})),
unassigned:[...unassigned],
teamCounter,
};
return db.ref(PATH_SAVES).set(saves);
}).then(()=>{
setSyncDot('online');
document.getElementById('save-name-input').value='';
renderSavePreview();
showToast('💾 "'+name+'" を保存しました');
}).catch(e=>{
setSyncDot('error');
alert('保存エラー: '+(e.message||e));
});
}
function renderSavePreview(){
const el=document.getElementById('save-list-preview');
el.innerHTML='<div class="empty-saves">読み込み中...</div>';
db.ref(PATH_SAVES).once('value').then(snap=>{
renderSaveItems(el, snap.val()||{}, false);
});
}
function renderLoadList(){
const el=document.getElementById('load-list');
el.innerHTML='<div class="empty-saves">読み込み中...</div>';
db.ref(PATH_SAVES).once('value').then(snap=>{
renderSaveItems(el, snap.val()||{}, true);
});
}
function renderSaveItems(el, saves, showLoad){
el.innerHTML='';
const keys=Object.keys(saves).sort((a,b)=>saves[b].savedAt>saves[a].savedAt?1:-1);
if(!keys.length){el.innerHTML='<div class="empty-saves">保存データがありません</div>';return;}
keys.forEach(key=>{
const s=saves[key];
const assigned=s.teams?s.teams.reduce((a,t)=>a+t.members.length,0):0;
const item=document.createElement('div');
item.className='save-item';
item.innerHTML=
'<div class="save-item-info">'+
'<div class="save-item-name">'+esc(s.name)+'</div>'+
'<div class="save-item-meta">'+s.savedAt+' by '+esc(s.savedBy||'?')+'　配置'+assigned+'名</div>'+
'</div>'+
'<div class="save-item-btns">'+
(showLoad?'<button class="btn-load-item">読込</button>':'')+
'<button class="btn-delete-item">削除</button>'+
'</div>';
if(showLoad) item.querySelector('.btn-load-item').addEventListener('click',()=>loadPattern(key,s));
item.querySelector('.btn-delete-item').addEventListener('click',()=>deletePattern(key,s.name));
el.appendChild(item);
});
}
function loadPattern(key, s){
if(!confirm('"'+s.name+'" を読み込みます。全員の画面が切り替わります。'))return;
setSyncDot('syncing');
db.ref(PATH_LIVE).set({
teams:s.teams, unassigned:s.unassigned, teamCounter:s.teamCounter,
updatedBy: 'load_'+myUserId,
updatedByName: 'スタッフ_'+myUserId.slice(-4),
updatedAt: firebase.database.ServerValue.TIMESTAMP,
}).then(()=>{
teams=s.teams.map(t=>({id:t.id,name:t.name,members:[...t.members]}));
unassigned=[...s.unassigned];
teamCounter=s.teamCounter||teams.reduce((m,t)=>Math.max(m,t.id),0);
renderAll();
setSyncDot('online');
closeLoadModal();
showToast('📂 "'+s.name+'" を全員に反映しました');
}).catch(e=>{setSyncDot('error');alert('読込エラー: '+e.message);});
}
function deletePattern(key, name){
if(!confirm('"'+name+'" を削除しますか？'))return;
db.ref(PATH_SAVES+'/'+key).remove().then(()=>{
renderSavePreview(); renderLoadList();
});
}
function openExport(){
let txt='';
teams.forEach(t=>{
const pc={};
t.members.forEach(i=>{const p=PLAYERS[i].pos||'未定';pc[p]=(pc[p]||0)+1;});
const ps=Object.entries(pc).map(([k,v])=>k+':'+v).join(' ');
txt+='【'+t.name+'】（'+t.members.length+'名）'+(ps?'　'+ps:'')+'
';
t.members.forEach(i=>{
const p=PLAYERS[i];
txt+=' '+p.name+'（'+p.grade+'｜'+p.height+'cm｜'+p.pos+'｜'+(p.gender==='男'?'男性':'女性')+'）
';
});
txt+='
';
});
if(unassigned.length>0){
txt+='【未配置】（'+unassigned.length+'名）
';
unassigned.forEach(i=>{txt+=' '+PLAYERS[i].name+'
';});
}
document.getElementById('export-text').value=txt;
document.getElementById('export-modal').classList.add('open');
}
function closeExport(){ document.getElementById('export-modal').classList.remove('open'); }
function copyExport(){
navigator.clipboard.writeText(document.getElementById('export-text').value);
showToast('📋 コピーしました');
}
function showToast(msg){
const t=document.getElementById('toast');
t.textContent=msg; t.style.opacity='1';
clearTimeout(t._t); t._t=setTimeout(()=>{t.style.opacity='0';},2500);
}
function esc(s){
return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}</script>
